services:
  - type: web
    name: datapulse-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datapulse-db
          property: connectionString

  - type: web
    runtime: static
    name: datapulse-dashboard
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: datapulse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: datapulse-db
    plan: free
    region: singapore
    databaseName: datapulse
    postgresMajorVersion: "18"